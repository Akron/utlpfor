name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-simd:
    name: Test (SIMD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Set up gotip
        run: |
          go install golang.org/dl/gotip@latest
          gotip download

      - name: Test with SIMD
        run: GOEXPERIMENT=simd gotip test -race -count=1 ./...

  test-scalar:
    name: Test (Scalar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Test without SIMD
        run: go test -race -count=1 ./...
