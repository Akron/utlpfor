name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-simd:
    name: Test (SIMD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Test with SIMD
        env:
          GOEXPERIMENT: simd
        run: go test -race -count=1 ./...

  test-scalar:
    name: Test (Scalar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Test without SIMD
        run: go test -race -count=1 ./...
